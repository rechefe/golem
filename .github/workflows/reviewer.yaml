# Reviewer agent: grills every PR; its verdict is the required `reviewer` status check.
#
# Security (pull_request_target runs with this repo's secrets, from main's workflow file):
#  - The workspace root is main (trusted CLAUDE.md, agents/). The PR head is checked out to
#    pr-head/ as read-only material and nothing from it is executed.
#  - Claude gets read tools and `gh pr` read/comment commands only; no general shell.
#  - PRs from forks never reach Claude: the check fails and the owner decides.
name: reviewer

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reviewer:
    runs-on: ubuntu-24.04
    environment: agents
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: External PRs need the owner
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "PR from a fork: the reviewer agent does not run on external code. Owner review required."
          exit 1

      - name: Checkout main (trusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout PR head (data only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          persist-credentials: false

      - name: Review
        id: review
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude
          prompt: |
            You are the reviewer agent for ${{ github.repository }}.
            Read CLAUDE.md, then agents/reviewer.md, then review PR #${{ github.event.pull_request.number }}.
            The PR's files are in ./pr-head (read-only); the spec is in ./pr-head/spec and ./spec.
            Get the diff with `gh pr diff ${{ github.event.pull_request.number }}` and the description
            and linked issue with `gh pr view ${{ github.event.pull_request.number }}`.
            Post your findings with `gh pr comment ${{ github.event.pull_request.number }} --body-file <file>`,
            then return the structured verdict.
          claude_args: >-
            --model opus
            --max-turns 80
            --add-dir pr-head
            --allowedTools "Read,Glob,Grep,Write(/tmp/**),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh issue view:*)"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["approve","request_changes"]},"blocking":{"type":"integer","minimum":0},"summary":{"type":"string"}},"required":["verdict","blocking","summary"]}'

      - name: Verdict
        env:
          RESULT: ${{ steps.review.outputs.structured_output }}
        run: |
          verdict=$(jq -r '.verdict // "missing"' <<<"$RESULT")
          echo "Reviewer verdict: $verdict ($(jq -r '.blocking' <<<"$RESULT") blocking)"
          jq -r '.summary' <<<"$RESULT" >> "$GITHUB_STEP_SUMMARY"
          [ "$verdict" = approve ]
