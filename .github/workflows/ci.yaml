# Design CI: Hardcaml build and unit tests, generated-Verilog freshness, cocotb, formal.
# Job names (rtl, sim, formal) are the required status checks on main.
#
# `pull_request` is what makes these checks appear on an agent's PR. `agent.yaml` checks out
# with no `token:` and no `persist-credentials: false`, so checkout persists the default
# GITHUB_TOKEN as git's credential and every push an agent makes goes out under it. GitHub
# starts no workflow run for an event that token triggers, which is why a `push`-only trigger
# left agent branches with no checks at all. Opening the PR is *not* suppressed, because
# claude-code-action opens it with the Claude App installation token -- so these jobs do run
# on `opened`.
#
# Residual gap: a later fix push is a GITHUB_TOKEN push too, so its `synchronize` event is
# suppressed and these checks do not refresh. An agent retrying on attempt 2 or 3 leaves the
# PR showing the stale result from `opened`. See gap 3 in agents/README.md.
#
# `pull_request` is unfiltered on purpose, unlike gds.yaml and docs.yaml: spec work targets
# `spec-provisional`, and a `branches: [main]` filter would leave those PRs unchecked. This
# workflow reads no secrets and takes `contents: read`, so running pull-request code on
# `pull_request` (not `pull_request_target`) is safe. `push` is kept to `main` only, so a PR
# does not run the same jobs twice.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rtl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: "5.3"
          dune-cache: true

      - name: Install Hardcaml
        run: opam install -y dune hardcaml.v0.17.1 hardcaml_waveterm ppx_hardcaml ppx_expect ppx_jane

      - name: Build and regenerate Verilog
        run: opam exec -- make rtl

      - name: Unit tests (expect tests)
        run: opam exec -- make unit

      - name: Generated Verilog is up to date
        run: opam exec -- make check-generated

  sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install cocotb
        run: pip install -r test/requirements.txt

      - name: cocotb tests
        run: make sim

      - name: Upload waveforms and results
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sim-results
          path: |
            test/tb.fst
            test/results.xml

  formal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install OSS CAD Suite (Yosys, SymbiYosys, solvers)
        uses: YosysHQ/setup-oss-cad-suite@c7845bc0d335c8076aa22047e85972caa8a916df # v4.1.0

      - name: SymbiYosys (prove + cover)
        run: make formal

      - name: Upload counterexamples and cover traces
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formal-traces
          path: |
            formal/*/engine_*/*.vcd
            formal/*/logfile.txt
