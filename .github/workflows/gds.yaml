# Hardening, precheck and gate-level test. ~1 h on a 6x4 die, which is why it does **not** run
# on pull requests: it would put an hour of latency into every round of the agent rework loop,
# and area and timing are properties of `main`, not of an individual PR. `rtl`, `sim` and
# `formal` are the per-PR gates; this is the daily one.
#
# It therefore must NOT be a required status check. A required check that no PR event reports
# leaves every PR permanently unmergeable, which is how PR #5 died -- see gap 3 in
# agents/README.md. Run it by hand on a PR with `workflow_dispatch` when a change plausibly
# moves area or timing.
#
# This workflow reads no secrets.
name: gds

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"  # 05:00 Israel time
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ihp-cmos5l
        with:
          pdk: ihp-sg13cmos5l

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ihp-cmos5l

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ihp-cmos5l

  viewer:
    needs: gds
    # Pages holds the layout of `main`. The old guard was on `pull_request`, which this
    # workflow no longer has; a `workflow_dispatch` on a branch would now publish over it,
    # so guard on the ref instead.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ihp-cmos5l
