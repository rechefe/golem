# Rework, half one: what happens when `ci` finishes on an agent's PR.
#
#   agent pushes -> ci
#     ci red   -> run the agent again (fix the build)
#     ci green -> run the reviewer
#
# The other half -- what happens on the reviewer's verdict -- lives in `reviewer.yaml` and not
# here, because this workflow cannot see it. A reviewer run reaches `workflow_run` either as a
# `workflow_dispatch` (dispatched below), whose `head_branch` is the default branch and whose
# `head_sha` is main's HEAD, or as a `pull_request_target`. Neither carries a usable handle on
# the PR in every case: `workflow_dispatch` points at main, and `workflow_run.pull_requests` is
# empty on some runs (35470154786, 35470495609, 35471288143 are three). `reviewer.yaml` has
# already resolved the PR, so the verdict acts there.
#
# Two things make this workable rather than obvious:
#
#  - It dispatches with `gh workflow run`, never by adding a label. `agent.yaml` fires on
#    `issues: labeled`, and a label added by this workflow would be a GITHUB_TOKEN event, which
#    starts no run -- the same suppression that kept `ci` off agent branches (gap 3 in
#    agents/README.md). `workflow_dispatch` is one of the two events exempt from it.
#  - It cannot loop. `agent.yaml` counts `Attempt N/3` comments on the issue and marks the
#    issue `status:stuck` past the cap, so the ping-pong ends whatever happens here.
#
# Every PR that goes green is sent to the reviewer, the owner's included -- `reviewer.yaml` is
# dispatch-only, so this is the only way any review starts. Only an agent's PR goes *back* to
# an agent on red: branch `<role>/<issue>-<slug>`, author `claude[bot]`, and not while its
# issue carries `status:blocked`. Drafts are skipped entirely.
name: rework

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write

jobs:
  next:
    runs-on: ubuntu-24.04
    if: github.event.workflow_run.conclusion != 'cancelled'
    steps:
      - name: Decide and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          # Look the PR up by head *branch*. `workflow_run.pull_requests` is empty on some runs
          # and a head-SHA match breaks the moment the branch is pushed again while `ci` runs.
          pr=$(gh pr list -R "$REPO" --state open --head "$HEAD_BRANCH" \
                 --json number,headRefName,headRefOid,author,body,isDraft --jq '.[0] // empty')
          if [ -z "$pr" ]; then echo "No open PR for $HEAD_BRANCH -- nothing to do."; exit 0; fi

          num=$(jq -r .number <<<"$pr")
          author=$(jq -r .author.login <<<"$pr")
          branch=$(jq -r .headRefName <<<"$pr")
          role=${branch%%/*}

          if [ "$(jq -r .isDraft <<<"$pr")" = true ]; then
            echo "PR #$num is a draft; nothing here drives one."
            exit 0
          fi

          # The branch may have moved on since this run started; act on what it ran.
          if [ "$(jq -r .headRefOid <<<"$pr")" != "$HEAD_SHA" ]; then
            echo "PR #$num has moved past $HEAD_SHA; a newer ci run will carry it."
            exit 0
          fi

          if [ "$CONCLUSION" = success ]; then
            # Every PR that goes green gets reviewed, not only an agent's -- `reviewer.yaml` is
            # dispatch-only, so this is the sole way any review starts. Once per commit: the
            # `reviewer` status is posted at the end of a review, so check for a run in flight
            # too, or a `ci` re-run would start a second one.
            seen=$(gh api "repos/$REPO/commits/$HEAD_SHA/status" \
                     --jq '[.statuses[] | select(.context=="reviewer")] | length')
            live=$(gh run list -R "$REPO" -w reviewer.yaml --limit 20 \
                     --json status,databaseId \
                     --jq '[.[] | select(.status=="in_progress" or .status=="queued")] | length')
            if [ "$seen" != 0 ] || [ "$live" != 0 ]; then
              echo "PR #$num: reviewer status=$seen, in-flight runs=$live -- not dispatching."
              exit 0
            fi
            echo "ci green on PR #$num -> reviewer"
            gh workflow run reviewer.yaml -R "$REPO" -f pr="$num"
            exit 0
          fi

          # ci red. Only an agent's PR goes back to an agent; the owner's are the owner's.
          case "$role" in spec|designer|verifier) ;; *) echo "PR #$num is not an agent branch."; exit 0;; esac
          if [ "$author" != "claude[bot]" ]; then echo "PR #$num was not opened by claude[bot]."; exit 0; fi

          issue=$(jq -r .body <<<"$pr" | grep -oiE 'closes #[0-9]+' | head -n1 | grep -oE '[0-9]+' || true)
          if [ -z "$issue" ]; then
            gh pr comment "$num" -R "$REPO" --body \
              "@rechefe this PR has no \`Closes #<issue>\` line, so the rework loop cannot find its issue and stops here."
            exit 0
          fi

          # `status:blocked` means an agent already judged this issue impossible as written.
          # Dispatching again would spend a run reaching the same wall -- and because a blocked
          # run withdraws its own attempt comment, the 3-attempt cap would never stop it. This
          # is the loop's real bound; the orchestrator's step 3 owns a blocked issue.
          if [ "$(gh issue view "$issue" -R "$REPO" --json labels \
                    --jq '[.labels[].name] | index("status:blocked") // "no"')" != no ]; then
            echo "Issue #$issue is status:blocked; the orchestrator decides, not this loop."
            exit 0
          fi

          echo "ci red on PR #$num -> agent ($role) on issue #$issue"
          gh workflow run agent.yaml -R "$REPO" -f role="$role" -f issue="$issue"
